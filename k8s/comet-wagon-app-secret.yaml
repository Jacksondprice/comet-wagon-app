apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: comet-wagon-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: comet-wagon-app-secrets
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: apps/comet-wagon-app
        property: db_password
    - secretKey: INTERNAL_API_TOKEN
      remoteRef:
        key: apps/comet-wagon-app
        property: api_token
